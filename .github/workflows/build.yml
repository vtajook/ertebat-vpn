name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag (e.g. v1.0.0). When set, a GitHub release with the APKs is published."
        required: false
        type: string
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray (Xray core)
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Java
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Unit tests
      continue-on-error: true
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew testPlaystoreDebugUnitTest

    # Release signing: add these repository secrets to get a stable signature
    # (required so customers can update the app in place):
    #   APP_KEYSTORE_BASE64, APP_KEYSTORE_PASSWORD, APP_KEYSTORE_ALIAS, APP_KEY_PASSWORD
    - name: Check signing secrets
      id: signing
      env:
        KS: ${{ secrets.APP_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KS" ]; then echo "has_keystore=true" >> $GITHUB_OUTPUT; else echo "has_keystore=false" >> $GITHUB_OUTPUT; fi

    - name: Decode keystore
      if: steps.signing.outputs.has_keystore == 'true'
      uses: timheuer/base64-to-file@v2.0.0
      id: android_keystore
      with:
        fileName: "android_keystore.jks"
        encodedString: ${{ secrets.APP_KEYSTORE_BASE64 }}

    - name: Build signed release APKs
      if: steps.signing.outputs.has_keystore == 'true'
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assemblePlaystoreRelease \
          -Pandroid.injected.signing.store.file=${{ steps.android_keystore.outputs.filePath }} \
          -Pandroid.injected.signing.store.password=${{ secrets.APP_KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.APP_KEYSTORE_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.APP_KEY_PASSWORD }}

    - name: Build debug-signed APKs (no keystore secrets set)
      if: steps.signing.outputs.has_keystore != 'true'
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assemblePlaystoreDebug

    - name: Upload APKs
      uses: actions/upload-artifact@v7
      with:
        name: apks
        path: |
          ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release/*.apk
          ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/debug/*.apk
        if-no-files-found: error

    - name: Publish GitHub release
      if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        APK_DIR=${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore
        if [ "${{ steps.signing.outputs.has_keystore }}" = "true" ]; then
          gh release create "${{ inputs.release_tag }}" $APK_DIR/release/*.apk \
            --title "${{ inputs.release_tag }}" --generate-notes
        else
          # no keystore secrets: debug-signed build, published as a pre-release for testing only
          gh release create "${{ inputs.release_tag }}" $APK_DIR/debug/*.apk \
            --title "${{ inputs.release_tag }} (test build)" --prerelease \
            --notes "Debug-signed test build. Add the keystore secrets for release-signed builds."
        fi
