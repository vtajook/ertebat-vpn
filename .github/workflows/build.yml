name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag (e.g. v1.0.0). When set, a GitHub release with the APKs is published."
        required: false
        type: string
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "30.0.16248370"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Install CMake and SWIG (OpenVPN 3 engine)
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "cmake;3.22.1"
        sudo apt-get update -qq
        sudo apt-get install -y -qq swig

    - name: Generate OpenVPN 3 bindings
      run: bash scripts/gen-ovpn3-swig.sh

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    # Cisco AnyConnect engine (libopenconnect + OpenSSL + libxml2), cross-built per ABI and cached.
    - name: Install NDK for libopenconnect
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        sudo apt-get install -y -qq autoconf automake libtool pkg-config cmake make

    - name: Restore cached libopenconnect
      id: cache-oc-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/oc-libs
        key: libopenconnect-${{ runner.os }}-${{ hashFiles('scripts/build-openconnect.sh', '.git/modules/third_party/openconnect/HEAD') }}

    - name: Build libopenconnect
      if: steps.cache-oc-restore.outputs.cache-hit != 'true'
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
      run: |
        export JAVA_HOME="${JAVA_HOME:-$(dirname $(dirname $(readlink -f $(which javac))))}"
        bash scripts/build-openconnect.sh
        mkdir -p oc-libs
        for a in arm64-v8a armeabi-v7a x86_64 x86; do mkdir -p oc-libs/$a; cp V2rayNG/app/libs/$a/libopenconnect.so oc-libs/$a/; done

    - name: Save libopenconnect
      if: steps.cache-oc-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/oc-libs
        key: libopenconnect-${{ runner.os }}-${{ hashFiles('scripts/build-openconnect.sh', '.git/modules/third_party/openconnect/HEAD') }}

    - name: Copy libopenconnect
      run: |
        for a in arm64-v8a armeabi-v7a x86_64 x86; do mkdir -p V2rayNG/app/libs/$a; cp oc-libs/$a/libopenconnect.so V2rayNG/app/libs/$a/; done

    # Xray core bridge, built from source so that Xray-core can be patched: since Xray 26.7.11 plain
    # VLESS/Trojan (no TLS/REALITY) is refused. scripts/patch_xray.py removes that check (the build
    # fails if the code it patches ever changes) while the core stays on the latest version.
    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: AndroidLibXrayLite/go.mod
        cache: false

    - name: Install NDK for libv2ray
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

    - name: Build libv2ray (patched Xray core)
      run: |
        bash scripts/build-libv2ray.sh
        mkdir -p V2rayNG/app/libs
        cp libv2ray-out/libv2ray.aar V2rayNG/app/libs/libv2ray.aar

    - name: Setup Java
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Unit tests
      continue-on-error: true
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew testPlaystoreDebugUnitTest

    # Release signing: add these repository secrets to get a stable signature
    # (required so customers can update the app in place):
    #   APP_KEYSTORE_BASE64, APP_KEYSTORE_PASSWORD, APP_KEYSTORE_ALIAS, APP_KEY_PASSWORD
    - name: Check signing secrets
      id: signing
      env:
        KS: ${{ secrets.APP_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KS" ]; then echo "has_keystore=true" >> $GITHUB_OUTPUT; else echo "has_keystore=false" >> $GITHUB_OUTPUT; fi

    - name: Decode keystore
      if: steps.signing.outputs.has_keystore == 'true'
      uses: timheuer/base64-to-file@v2.0.0
      id: android_keystore
      with:
        fileName: "android_keystore.jks"
        encodedString: ${{ secrets.APP_KEYSTORE_BASE64 }}

    - name: Build signed release APKs
      if: steps.signing.outputs.has_keystore == 'true'
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assemblePlaystoreRelease \
          -Pandroid.injected.signing.store.file=${{ steps.android_keystore.outputs.filePath }} \
          -Pandroid.injected.signing.store.password=${{ secrets.APP_KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.APP_KEYSTORE_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.APP_KEY_PASSWORD }}

    - name: Build test-signed release APKs (no keystore secrets set)
      if: steps.signing.outputs.has_keystore != 'true'
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assemblePlaystoreRelease

    - name: Upload APKs
      uses: actions/upload-artifact@v7
      with:
        name: apks
        path: |
          ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/release/*.apk
          ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/debug/*.apk
        if-no-files-found: error

    - name: Publish GitHub release
      if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        APK_DIR=${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore
        if [ "${{ steps.signing.outputs.has_keystore }}" = "true" ]; then
          gh release create "${{ inputs.release_tag }}" $APK_DIR/release/*.apk \
            --title "${{ inputs.release_tag }}" --generate-notes
        else
          # no keystore secrets: debug-signed build, published as a pre-release for testing only
          gh release create "${{ inputs.release_tag }}" $APK_DIR/release/*.apk \
            --title "${{ inputs.release_tag }} (test build)" --prerelease \
            --notes "Test-signed build (public test key). Add the keystore secrets for release-signed builds."
        fi
